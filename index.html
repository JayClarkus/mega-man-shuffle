<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Man Shuffle</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="menu-btn" type="button" aria-label="Select game" aria-expanded="false" aria-controls="game-menu">
        <img id="menu-icon" alt="">
    </button>
    <div id="menu-overlay" class="menu-overlay"></div>
    <nav id="game-menu" class="game-menu" aria-hidden="true">
        <p class="game-menu-title">Select Game</p>
        <ul id="game-list" class="game-list"></ul>
    </nav>

    <section id="home-view" class="home-view">
        <h1 class="home-title">Mega Man Shuffle</h1>
        <p class="subtitle">-Select a Game-</p>
        <br>
        <div id="game-covers" class="game-covers"></div>
        <p class="flavor-text">Randomize your run and take on the stages in a whole new way!</p>
    </section>

    <script src="shared/app.js"></script>
</body>
</html>
