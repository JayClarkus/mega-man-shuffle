<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Man 10 Shuffle</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <button id="menu-btn" type="button" aria-label="Select game" aria-expanded="false" aria-controls="game-menu">
        <img id="menu-icon" alt="">
    </button>
    <div id="menu-overlay" class="menu-overlay"></div>
    <nav id="game-menu" class="game-menu" aria-hidden="true">
        <button id="home-btn" type="button" class="game-option">Home</button>
        <p class="game-menu-title">Classic Series</p>
        <ul id="game-list" class="game-list"></ul>
        <div class="menu-donate">
         <style>.pp-8ZA954SJUMY6G{text-align:left;border:none;border-radius:0.25rem;min-width:11.625rem;padding:0 2rem;height:2.625rem;font-weight:bold;background-color:#FFD140;color:#000000;font-family:'Mega Man 2','Helvetica Neue',Arial,sans-serif;font-size:1rem;line-height:1.25rem;cursor:pointer;}</style>
         <form action="https://www.paypal.com/ncp/payment/8ZA954SJUMY6G" method="post" target="_blank" style="display:inline-grid;justify-items:center;align-content:start;gap:0.5rem;">
         <input class="pp-8ZA954SJUMY6G" type="submit" value="Donate" />
         </form>
        </div>
    </nav>

    <main id="game-view" class="container" data-game-id="10">
        <h1 id="game-title"></h1>
        <br>
        <p class="subtitle">Stage Order</p>
        <br>
        <div id="boss-grid" class="boss-grid"></div>
        <br>

        <button id="shuffle-btn" type="button">Shuffle</button>
    </main>

    <script src="../shared/app.js"></script>
</body>
</html>
